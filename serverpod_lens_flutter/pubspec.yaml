name: serverpod_lens_flutter
description: Demo app for the embeddable Serverpod Lens schema viewer.

publish_to: none

version: 1.0.0+1

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  serverpod_lens:
    path: ../serverpod_lens
  file_selector: ^1.1.0

  flutter_driver:
    sdk: flutter
dev_dependencies:
  vyuh_diagram_extension_snap_guides:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  vyuh_diagram_extension_minimap:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  vyuh_diagram_extension_table_flutter:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  vyuh_diagram_flutter: ^3.5.1
  vyuh_diagram_core: ^3.5.1
  vyuh_diagram_codec_svg: ^3.5.1
  vyuh_diagram_extension_connectors:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  vyuh_diagram_extension_layout:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  vyuh_diagram_extension_table:
    hosted: https://pub.vyuh.tech
    version: ^3.5.1
  archive: ^4.3.0
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/schema_graph.json
