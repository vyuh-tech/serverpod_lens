name: serverpod_lens
description: Embeddable read-only schema viewer for Serverpod development tools.
version: 0.1.0
publish_to: https://pub.vyuh.tech
publish_to_tier: internal
repository: https://github.com/vyuh-tech/serverpod_lens
issue_tracker: https://github.com/vyuh-tech/serverpod_lens/issues
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  serverpod_lens_schema:
    hosted: https://pub.vyuh.tech
    version: ^0.1.0
  shared_preferences: ^2.5.6
  vyuh_diagram_flutter: ^3.7.2
  vyuh_diagram_core: ^3.7.2
  vyuh_diagram_extension_snap_guides:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  vyuh_diagram_extension_connectors:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  vyuh_diagram_extension_minimap:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  vyuh_diagram_extension_layout:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  vyuh_diagram_extension_table:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  vyuh_diagram_extension_table_flutter:
    hosted: https://pub.vyuh.tech
    version: ^3.7.2
  flutter_mobx: ^2.4.0
  mobx: ^2.7.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'

# Keep this Flutter-only override out of the backend's Cloud workspace.
# 0.1.5 publishes workspace paths absent from its package archive.
dependency_overrides:
  base_menu: 0.2.0

flutter:
  uses-material-design: true
