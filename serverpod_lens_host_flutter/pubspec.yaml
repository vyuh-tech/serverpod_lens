name: serverpod_lens_host_flutter
description: Authenticated Serverpod host for the reusable Lens schema viewer.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  serverpod_flutter: 4.0.4
  serverpod_auth_idp_flutter: 4.0.4
  cupertino_icons: ^1.0.8
  serverpod_lens:
    path: ../serverpod_lens
  serverpod_lens_client:
    path: ../serverpod_lens_client
dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
