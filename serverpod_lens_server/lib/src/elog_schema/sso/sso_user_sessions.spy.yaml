class: SsoUserSessions
table: sso_user_sessions
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  sessionToken: UuidValue
  authSessionId: UuidValue?
  deviceLabel: String?
  userAgent: String?
  ipAddress: String?
  createdAt: DateTime
  lastActiveAt: DateTime
  inactivityTimeoutMinutes: int
  policySiteId: UuidValue?
  inactivityEnabledAt: DateTime?
  productCode: String?
  browserId: String?
  browserSessionPolicy: String
  deviceType: String?
  revokedAt: DateTime?
  revokeReason: String?
