class: SsoProductSettings
table: sso_product_settings
fields:
  id: UuidValue?, defaultPersist=random
  productId: UuidValue, relation(parent=sso_products)
  displayName: String?
  logoUrl: String?
  supportEmail: String?
  language: String?
  timeZone: String?
  dateFormat: String?
  timeFormat: String?
  numberFormat: String?
  firstDayOfWeek: int?
  metadata: String?
