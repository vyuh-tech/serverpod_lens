class: ElogToolingProductQualifications
table: elog_tooling_product_qualifications
fields:
  id: UuidValue?, defaultPersist=random
  toolingTypeId: UuidValue, relation(parent=elog_tooling_types)
  productId: UuidValue, relation(parent=elog_products)
  status: String
  effectiveFrom: DateTime
  effectiveUntil: DateTime?
  qualificationReference: String?
  qualifiedAt: DateTime
  qualifiedBy: UuidValue?, relation(parent=sso_users)
  versionNumber: int
  isActive: bool
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
