class: ElogProblems
table: elog_problems
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  problemTypeId: UuidValue, relation(parent=elog_problem_types)
  title: String
  description: String?
  resourceType: String
  resourceId: UuidValue?
  workflowStatus: String
  severity: String
  priority: String
  assignedToGroupId: UuidValue?, relation(parent=elog_user_groups)
  assignedTo: UuidValue?, relation(parent=sso_users)
  resourceUsageId: UuidValue?, relation(parent=elog_resource_usages)
  detailsLogUsageId: UuidValue?, relation(parent=elog_log_usages)
  activityId: UuidValue?, relation(parent=elog_activities)
  attachments: String?
  linkedProblems: List<UuidValue>?
  createdResourceFlags: List<UuidValue>?
  handlingPolicySnapshot: String
  investigationRequired: bool
  investigationCompletedAt: DateTime?
  investigationCompletedBy: UuidValue?, relation(parent=sso_users)
  reviewStatus: String
  reviewerGroupIds: List<UuidValue>?
  reviewWorkflowInstanceId: UuidValue?, relation(parent=elog_workflow_instances)
  remediationStatus: String
  remediationActivityIds: List<UuidValue>?
  remediationPlanSnapshot: String
  reportSignature: String?
  resolutionSignature: String?
  resolutionWitnessSignature: String?
  resolutionWitnessUserId: UuidValue?, relation(parent=sso_users)
  versionNumber: int
  isActive: bool
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
