class: ElogWorkItems
table: elog_work_items
fields:
  id: UuidValue?, defaultPersist=random
  idField: UuidValue
  workflowInstanceId: UuidValue
  nodeId: String
  taskType: String
  title: String
  description: String?
  status: String
  assignedUserIds: List<String>
  assignedGroupIds: List<String>
  assignedRoleIds: List<String>
  signalName: String?
  priority: String
  dueAt: DateTime?
  input: String
  output: String
  metadata: String
  completedBy: UuidValue?
  completedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
  startedAt: DateTime?
  createdBy: UuidValue?, relation(parent=sso_users)
  startedBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
