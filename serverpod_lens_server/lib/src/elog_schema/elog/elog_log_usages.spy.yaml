class: ElogLogUsages
table: elog_log_usages
fields:
  id: UuidValue?, defaultPersist=random
  logTemplateId: UuidValue, relation(parent=elog_log_templates)
  title: String?
  data: String
  status: String
  resourceType: String?
  resourceId: UuidValue?
  logTemplateVersionNumber: int?
  lockedBy: UuidValue?, relation(parent=sso_users)
  lockedAt: DateTime?
