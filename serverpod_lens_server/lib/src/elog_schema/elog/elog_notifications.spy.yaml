class: ElogNotifications
table: elog_notifications
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  type: String
  title: String
  message: String?
  resourceType: String?
  resourceId: UuidValue?
  workflowInstanceId: UuidValue?, relation(parent=elog_workflow_instances)
  workflowTaskId: UuidValue?, relation(parent=elog_work_items)
  isRead: bool?
  readAt: DateTime?
  groupKey: String?
  latestOccurrenceKey: String?
  occurrenceCount: int
  firstOccurredAt: DateTime?
  lastOccurredAt: DateTime?
  createdAt: DateTime?
  metadata: String?
