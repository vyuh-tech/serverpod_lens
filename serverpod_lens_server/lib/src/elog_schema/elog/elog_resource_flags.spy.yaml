class: ElogResourceFlags
table: elog_resource_flags
fields:
  id: UuidValue?, defaultPersist=random
  flagTypeId: UuidValue, relation(parent=elog_resource_flag_types)
  resourceType: String
  resourceId: UuidValue
  flagStatus: String
  problemId: UuidValue?, relation(parent=elog_problems)
  flaggedAt: DateTime
  flaggedBy: UuidValue, relation(parent=sso_users)
  reason: String?
  clearanceRequestedAt: DateTime?
  clearanceRequestedBy: UuidValue?, relation(parent=sso_users)
  clearanceLogUsageId: UuidValue?, relation(parent=elog_log_usages)
  clearedAt: DateTime?
  clearedBy: UuidValue?, relation(parent=sso_users)
  clearanceNotes: String?
  versionNumber: int
  isActive: bool
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
