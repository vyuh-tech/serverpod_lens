class: ElogUnitOfMeasures
table: elog_unit_of_measures
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  name: String
  symbol: String
  description: String?
  isActive: bool
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
  versionNumber: int
