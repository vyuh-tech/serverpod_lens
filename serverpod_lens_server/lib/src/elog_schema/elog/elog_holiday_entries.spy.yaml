class: ElogHolidayEntries
table: elog_holiday_entries
fields:
  id: UuidValue?, defaultPersist=random
  holidayCalendarId: UuidValue, relation(parent=elog_holiday_calendars)
  entryDate: DateTime
  name: String
  description: String?
  category: String?
  isHalfDay: bool?
  halfDayPeriod: String?
  isWorkingOverride: bool?
