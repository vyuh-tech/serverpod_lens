class: ElogPdUsageLedger
table: elog_pd_usage_ledger
fields:
  id: UuidValue?, defaultPersist=random
  operationId: UuidValue, relation(parent=elog_pd_operations)
  assemblyId: UuidValue, relation(parent=elog_pd_assemblies)
  componentId: UuidValue, relation(parent=elog_equipment_parts)
  quantity: BigInt
  unit: String
  attribution: String
  createdAt: DateTime
