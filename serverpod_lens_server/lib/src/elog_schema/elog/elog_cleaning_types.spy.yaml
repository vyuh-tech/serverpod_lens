class: ElogCleaningTypes
table: elog_cleaning_types
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  name: String
  description: String?
  category: String
  estimatedDurationMinutes: int?
  holdTimeMinutes: int?
  tierRank: int
  validityMinutes: int?
  checklistTemplateId: UuidValue?, relation(parent=elog_checklist_templates)
  logTemplateId: UuidValue?, relation(parent=elog_log_templates)
  appliesToAreas: bool?
  appliesToEquipment: bool?
  instructions: String?
  sopReference: String?
  color: String?
  icon: String?
  isActive: bool?
