class: ElogEvents
table: elog_events
fields:
  id: UuidValue?, defaultPersist=random
  idField: UuidValue
  eventNumber: BigInt
  streamType: String
  streamId: UuidValue
  eventType: String
  eventCategory: String
  eventAt: DateTime
  createdAt: DateTime
  performedBy: UuidValue?, relation(parent=sso_users)
  correlationId: UuidValue?
  causationId: UuidValue?
  notes: String?
  eventData: String
  metadata: String
