### Fictional university fixture: enrolment.
class: CampusCompletion
table: campus_completions
fields:
  id: UuidValue?, defaultPersist=random
  studentId: UuidValue, relation(parent=campus_students)
  programmeVersionId: UuidValue, relation(parent=campus_programme_versions)
  completedAt: DateTime
  awardedCredits: int
  classification: String?
  createdAt: DateTime, default=now
