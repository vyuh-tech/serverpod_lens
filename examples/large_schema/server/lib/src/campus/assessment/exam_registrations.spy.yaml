### Fictional university fixture: assessment.
class: CampusExamRegistration
table: campus_exam_registrations
fields:
  id: UuidValue?, defaultPersist=random
  examSessionId: UuidValue, relation(parent=campus_exam_sessions)
  studentId: UuidValue, relation(parent=campus_students)
  seatId: UuidValue?, relation(parent=campus_exam_seats)
  attended: bool
  createdAt: DateTime, default=now
indexes:
  campus_exam_registrations_u0:
    fields: examSessionId,studentId
    unique: true
  campus_exam_registrations_u1:
    fields: seatId
    unique: true
