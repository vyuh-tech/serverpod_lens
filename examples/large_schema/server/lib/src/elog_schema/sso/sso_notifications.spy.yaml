class: SsoNotifications
table: sso_notifications
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  type: String
  title: String
  message: String?
  resourceType: String?
  resourceId: UuidValue?
  isRead: bool
  readAt: DateTime?
  createdAt: DateTime
  metadata: String?
