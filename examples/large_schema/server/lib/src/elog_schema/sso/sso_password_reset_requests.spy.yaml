class: SsoPasswordResetRequests
table: sso_password_reset_requests
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  requestedBy: String
  requestType: String
  status: String
  remarks: String?
  decisionNote: String?
  approvedBy: UuidValue?, relation(parent=sso_users)
  approvedAt: DateTime?
  rejectedBy: UuidValue?, relation(parent=sso_users)
  rejectedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?
  updatedBy: UuidValue?
