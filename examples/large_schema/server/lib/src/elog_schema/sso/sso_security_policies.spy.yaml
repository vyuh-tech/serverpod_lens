class: SsoSecurityPolicies
table: sso_security_policies
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  code: String
  description: String?
  scopeLevel: String
  siteId: UuidValue?, relation(parent=sso_sites)
  inheritedFields: List<String>
  minUserIdLength: int
  maxUserIdLength: int
  minPasswordLength: int
  maxPasswordLength: int
  passwordMaxAgeDays: int
  passwordMinAgeDays: int
  passwordHistoryCount: int
  passwordExpiryWarningDays: int
  passwordComplexity: String
  maxFailedLoginAttempts: int
  inactivityTimeoutEnabled: bool
  inactivityTimeoutMinutes: int
  dormancyThresholdDays: int
  preventConcurrentLogin: String
  browserSessionPolicy: String
  companyId: UuidValue, relation(parent=sso_companies)
