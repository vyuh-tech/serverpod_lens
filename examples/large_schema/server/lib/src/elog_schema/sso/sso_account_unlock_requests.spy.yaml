class: SsoAccountUnlockRequests
table: sso_account_unlock_requests
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  requestedBy: String
  lockoutReason: String?
  failedLoginAttempts: int?
  status: String
  remarks: String?
  decisionNote: String?
  approvedBy: UuidValue?, relation(parent=sso_users)
  approvedAt: DateTime?
  rejectedBy: UuidValue?, relation(parent=sso_users)
  rejectedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?
  updatedBy: UuidValue?
