class: ElogUserGroupMembers
table: elog_user_group_members
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  userGroupId: UuidValue, relation(parent=elog_user_groups)
  isActive: bool?
  createdAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedAt: DateTime
  updatedBy: UuidValue?, relation(parent=sso_users)
