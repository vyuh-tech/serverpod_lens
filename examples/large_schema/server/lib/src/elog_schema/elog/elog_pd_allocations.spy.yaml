class: ElogPdAllocations
table: elog_pd_allocations
fields:
  id: UuidValue?, defaultPersist=random
  punchSetId: UuidValue, relation(parent=elog_punch_sets)
  requestedQuantity: int
  issuedTo: UuidValue?, relation(parent=sso_users)
  issuedToGroupId: UuidValue?, relation(parent=elog_user_groups)
  equipmentId: UuidValue, relation(parent=elog_equipments)
  createdAt: DateTime
  policy: String
