class: ElogChecklistUsages
table: elog_checklist_usages
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  checklistTemplateId: UuidValue, relation(parent=elog_checklist_templates)
  checklistTemplateVersionNumber: int
  resourceType: String?
  resourceId: UuidValue?
  status: String
  totalInstructions: int?
  completedInstructions: int?
