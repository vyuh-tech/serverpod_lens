class: ElogResourceFlagTypes
table: elog_resource_flag_types
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  name: String
  description: String?
  category: String
  icon: String?
  color: String
  blocksUsage: bool
  requiresClearance: bool
  clearanceRoles: List<String>?
  autoClearAfterMinutes: int?
  canBeCreatedByRoles: List<String>?
  clearanceLogTemplateId: UuidValue?, relation(parent=elog_log_templates)
  isActive: bool
