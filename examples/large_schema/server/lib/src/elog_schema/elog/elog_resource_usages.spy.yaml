class: ElogResourceUsages
table: elog_resource_usages
fields:
  id: UuidValue?, defaultPersist=random
  resourceType: String
  resourceId: UuidValue
  operatingAreaId: UuidValue?, relation(parent=elog_areas)
  startedBy: UuidValue, relation(parent=sso_users)
  stoppedBy: UuidValue?, relation(parent=sso_users)
  status: String
  startedAt: DateTime
  stoppedAt: DateTime?
  productId: UuidValue?, relation(parent=elog_products)
  batchId: UuidValue?, relation(parent=elog_batches)
  batchDisposition: String?
  campaignBatchNumber: int?
  campaignBatchLimit: int?
