class: ElogActivities
table: elog_activities
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  description: String?
  activityType: String
  cleaningTypeId: UuidValue?, relation(parent=elog_cleaning_types)
  policyDomain: String
  resourceType: String
  resourceId: UuidValue?
  operatingAreaId: UuidValue?, relation(parent=elog_areas)
  assignedToUserId: UuidValue?, relation(parent=sso_users)
  assignedToGroupId: UuidValue?, relation(parent=elog_user_groups)
  assignedBy: UuidValue?, relation(parent=sso_users)
  assignedAt: DateTime?
  startedBy: UuidValue?, relation(parent=sso_users)
  submittedBy: UuidValue?, relation(parent=sso_users)
  completedBy: UuidValue?, relation(parent=sso_users)
  resourceUsageId: UuidValue?, relation(parent=elog_resource_usages)
  witnessId: UuidValue?, relation(parent=sso_users)
  operatorSignature: String?
  witnessSignature: String?
  cancellationReason: String?
  origin: String
  problemId: UuidValue?, relation(parent=elog_problems)
  scheduleRef: String?
  pausedByProblemId: UuidValue?, relation(parent=elog_problems)
  scheduledAt: DateTime?
  dueAt: DateTime?
  startedAt: DateTime?
  submittedAt: DateTime?
  completedAt: DateTime?
  activityConfigSnapshot: String
  metadata: String
  status: String
  priority: String
  workflowInstanceId: UuidValue?
  isActive: bool
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
  versionNumber: int
