class: ElogPunchSets
table: elog_punch_sets
fields:
  id: UuidValue?, defaultPersist=random
  idField: UuidValue
  code: String
  name: String
  description: String?
  manufacturer: String?
  modelNumber: String?
  serialNumber: String?
  purchaseDate: DateTime?
  installationDate: DateTime?
  warrantyExpiry: DateTime?
  productId: UuidValue?, relation(parent=elog_products)
  supplierId: UuidValue?, relation(parent=elog_business_associates)
  manufacturingMonth: String?
  drawingReference: String?
  punchSpecification: String?
  dieSpecification: String?
  upperEmbossing: String?
  lowerEmbossing: String?
  tabletShape: String?
  receivedOn: DateTime?
  openingTabletsMillions: double?
  lastIssuedStart: int?
  lastIssuedEnd: int?
  partsManifest: String?
  registeredComponentCounts: String?
  toolingTypeId: UuidValue?, relation(parent=elog_tooling_types)
  inventoryMode: String
