class: ElogLogReportGenerations
table: elog_log_report_generations
fields:
  id: UuidValue?, defaultPersist=random
  templateId: UuidValue, relation(parent=elog_report_templates)
  templateName: String
  generatedBy: UuidValue, relation(parent=sso_users)
  generatedAt: DateTime
  reportFormat: String
  recordCount: int
  filters: String?
  ipAddress: String?
  userAgent: String?
