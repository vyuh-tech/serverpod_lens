class: ElogUserRoles
table: elog_user_roles
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=sso_users)
  roleId: UuidValue, relation(parent=elog_roles)
  createdAt: DateTime?
  updatedAt: DateTime?
  createdBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
  isActive: bool?
