class: ElogPresetSchedules
table: elog_preset_schedules
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  name: String
  description: String?
  scheduleConfig: String
  effectiveFrom: DateTime?
  effectiveUntil: DateTime?
  toleranceMinutes: int?
  escalationMinutes: int?
  resourceType: String?
  resourceIds: List<UuidValue>?
  isActive: bool?
  priority: int?
  createdAt: DateTime?
  updatedAt: DateTime?
  createdBy: UuidValue?
  updatedBy: UuidValue?
