class: ElogEquipments
table: elog_equipments
fields:
  id: UuidValue?, defaultPersist=random
  code: String
  name: String
  description: String?
  manufacturer: String?
  modelNumber: String?
  serialNumber: String?
  purchaseDate: DateTime?
  installationDate: DateTime?
  warrantyExpiry: DateTime?
  equipmentCategoryId: UuidValue?, relation(parent=elog_equipment_categories)
