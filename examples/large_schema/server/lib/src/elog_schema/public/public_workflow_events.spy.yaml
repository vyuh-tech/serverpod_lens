class: PublicWorkflowEvents
table: public_workflow_events
fields:
  id: UuidValue?, defaultPersist=random
  workflowInstanceId: UuidValue, relation(parent=public_workflow_instances)
  eventType: String
  timestamp: DateTime
  nodeId: String?
  userTaskId: UuidValue?, relation(parent=public_workflow_user_tasks)
  tokenId: String?
  userId: UuidValue?, relation(parent=sso_users)
  data: String
  metadata: String
  createdAt: DateTime
  updatedAt: DateTime
