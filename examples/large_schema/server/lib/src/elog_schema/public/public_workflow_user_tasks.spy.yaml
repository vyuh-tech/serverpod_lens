class: PublicWorkflowUserTasks
table: public_workflow_user_tasks
fields:
  id: UuidValue?, defaultPersist=random
  workflowInstanceId: UuidValue, relation(parent=public_workflow_instances)
  nodeId: String
  taskType: String
  title: String
  description: String?
  status: String
  assignedUserIds: List<String>
  assignedGroupIds: List<String>
  assignedRoleIds: List<String>
  signalName: String?
  priority: String
  dueAt: DateTime?
  input: String
  output: String
  metadata: String
  completedBy: UuidValue?, relation(parent=sso_users)
  completedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
  startedAt: DateTime?
  createdBy: UuidValue?, relation(parent=sso_users)
  startedBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
