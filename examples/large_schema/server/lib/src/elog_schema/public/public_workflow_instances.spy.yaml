class: PublicWorkflowInstances
table: public_workflow_instances
fields:
  id: UuidValue?, defaultPersist=random
  workflowId: UuidValue, relation(parent=public_public)
  workflowVersion: int
  status: String
  input: String
  output: String
  variables: String
  tokens: String
  runNumber: int
  parentInstanceId: UuidValue?, relation(parent=public_workflow_instances)
  parentNodeId: String?
  error: String?
  correlationId: String?
  metadata: String
  createdAt: DateTime
  updatedAt: DateTime
  startedAt: DateTime?
  completedAt: DateTime?
  createdBy: UuidValue?, relation(parent=sso_users)
  startedBy: UuidValue?, relation(parent=sso_users)
  completedBy: UuidValue?, relation(parent=sso_users)
  updatedBy: UuidValue?, relation(parent=sso_users)
