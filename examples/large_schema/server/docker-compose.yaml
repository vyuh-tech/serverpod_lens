services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_lens
      POSTGRES_PASSWORD: "vQU6HvKJJW_Vj7Cony9Yp6ge6xQGOY_A"
    volumes:
      - serverpod_lens_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "iaE6WIoIvdMEKPYrzU8LPNpYnz-Mta-B"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_lens_test
      POSTGRES_PASSWORD: "e9_mD-0rYKCzyvacmynQhNFQNqfIJ7NF"
    volumes:
      - serverpod_lens_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "CHGsHLGwbbFGl5gMQyzxby9B5tcwV0jv"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  serverpod_lens_data:
  serverpod_lens_test_data:
